name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: TypeScript, tests, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SGW_E2E_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:rust
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run package:dry-run

  macos-native:
    name: macOS native surfaces
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test -- --no-file-parallelism

  windows_shards:
    name: Windows tests (${{ matrix.group }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [core, store, client, credential, acl]
    env:
      SGW_WINDOWS_CREDENTIAL_HELPER_TIMEOUT_MS: 120000
      SGW_WINDOWS_PROCESS_INSPECTION_TIMEOUT_MS: 120000
      SGW_WINDOWS_STARTUP_OPERATION_TIMEOUT_MS: 120000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm run test:windows -- --group ${{ matrix.group }}

  windows-preview:
    name: Windows preview client
    runs-on: ubuntu-latest
    needs: windows_shards
    if: always()
    timeout-minutes: 5
    steps:
      - name: Verify Windows test shards
        env:
          WINDOWS_RESULT: ${{ needs.windows_shards.result }}
        run: test "$WINDOWS_RESULT" = success
