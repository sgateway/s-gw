<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>s-gw</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #e7eef8;
        background: #07101c;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.11), transparent 34rem),
          radial-gradient(circle at 82% 72%, rgba(59, 130, 246, 0.10), transparent 30rem),
          #07101c;
      }

      main {
        width: min(34rem, calc(100vw - 3rem));
        padding: 2.25rem;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 1.25rem;
        background: rgba(10, 22, 38, 0.88);
        box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.34);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        color: #67e8f9;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .pulse {
        width: 0.75rem;
        height: 0.75rem;
        border-radius: 999px;
        background: #22d3ee;
        box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.55);
        animation: pulse 1.7s ease-out infinite;
      }

      h1 {
        margin: 1.35rem 0 0.65rem;
        font-size: clamp(1.6rem, 4vw, 2.1rem);
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: #9fb0c5;
        line-height: 1.65;
      }

      .hint {
        margin-top: 1.35rem;
        padding-top: 1.25rem;
        border-top: 1px solid rgba(148, 163, 184, 0.16);
        font-size: 0.9rem;
      }

      code {
        color: #c4b5fd;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      @keyframes pulse {
        70% { box-shadow: 0 0 0 0.75rem rgba(34, 211, 238, 0); }
        100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="pulse" aria-hidden="true"></span>s-gw desktop</div>
      <h1 id="status-title">Starting your local credential service</h1>
      <p id="status-detail">The native app will open as soon as the loopback console is verified.</p>
      <p class="hint">The browser console remains available as a backup at <code>http://127.0.0.1:8718/</code>.</p>
    </main>
  </body>
</html>
