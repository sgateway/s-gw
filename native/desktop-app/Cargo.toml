[package]
name = "s-gw-desktop"
version = "0.1.19"
description = "Native Windows and Linux desktop shell for s-gw"
authors = ["Barry Yuan"]
edition = "2021"
rust-version = "1.96.1"
license = "Apache-2.0"
repository = "https://github.com/sgateway/s-gw"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell"
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
