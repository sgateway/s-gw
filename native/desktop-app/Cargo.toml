[package]
name = "s-gw-desktop"
version = "0.1.19"
description = "Native Windows and Linux desktop application for s-gw"
authors = ["Barry Yuan"]
edition = "2021"
rust-version = "1.96.1"
license = "Apache-2.0"
repository = "https://github.com/sgateway/s-gw"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
egui = "=0.36.1"
egui_extras = "=0.36.1"
image = { version = "=0.25.6", default-features = false, features = ["png"] }
open = "=5.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
single-instance = "=0.3.3"
tray-icon = "=0.24.2"
url = "=2.5.7"
zeroize = "=1.8.2"

[target.'cfg(unix)'.dependencies]
eframe = { version = "=0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
libc = "=0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[dev-dependencies]
egui_kittest = "=0.36.1"

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "=0.36.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu_no_default_features"] }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "wgsl", "dx12"] }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell"
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
